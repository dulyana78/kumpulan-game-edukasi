<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis & Tebak Gambar Edukasi</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#eef5ff,#fff4f6);color:#26364e}.app{max-width:900px;margin:auto;padding:14px}.hero{background:linear-gradient(120deg,#5279ef,#9469e8);color:white;padding:24px;border-radius:22px}.tabs{display:flex;gap:8px;margin:15px 0}.tab,button{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.tab{background:#e4eaff;color:#465b9b}.active,.primary{background:#4778ed;color:white}.panel{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #253a5b12}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #dce5f2;border-radius:11px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.green{background:#20b981;color:white}.pink{background:#ff729b;color:white}.secondary{background:#edf1f8;color:#445}.badge{background:#eef3ff;border-radius:30px;padding:7px 10px;font-weight:800}.progress{height:9px;background:#edf1f8;border-radius:20px;margin:12px 0;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#5788f5,#9a70e9);width:0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.option{background:#fbfdff;border:2px solid #e2e9f5;text-align:left;font-size:16px}.option.correct{background:#e5fff3;border-color:#20b981}.option.wrong{background:#fff0f4;border-color:#ff729b}.feedback{padding:12px;border-radius:12px;margin:10px 0;font-weight:800}.ok{background:#e5fff3;color:#137b54}.no{background:#fff0f4;color:#b83d62}.art{min-height:220px;display:grid;place-items:center;background:#f4f8ff;border-radius:16px}.art svg{width:280px;height:210px}.hint{background:#fff7db;padding:12px;border-radius:12px;margin:12px 0}.score{font-size:48px;font-weight:900;color:#4778ed;text-align:center}.small{color:#68778c;font-size:13px}.timer{color:#e88b22;font-weight:900}@media(max-width:600px){.grid,.options{grid-template-columns:1fr}.app{padding:10px}.actions button{width:100%}}</style><main class="app"><header class="hero"><h1>🎓 Media Kuis & Tebak Gambar</h1><p>Belajar sambil bermain • Offline • HP & komputer</p></header><nav class="tabs"><button class="tab active" onclick="mode('quiz')">📝 Kuis</button><button class="tab" onclick="mode('pic')">🖼️ Tebak Gambar</button></nav><section id="setup" class="panel"><h2>Pengaturan Kuis</h2><div class="grid"><div class="field"><label>Nama sekolah</label><input id="school" placeholder="Nama sekolah"></div><div class="field"><label>Guru</label><input id="teacher" placeholder="Nama guru"></div><div class="field"><label>Mata pelajaran</label><input id="subject" value="IPAS"></div><div class="field"><label>Kelas</label><select id="kelas"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Materi</label><input id="material" value="Hewan dan habitatnya"></div><div class="field"><label>Jumlah soal</label><select id="count"><option>5</option><option selected>10</option><option>15</option></select></div><div class="field"><label>Kesulitan</label><select id="difficulty"><option>Mudah</option><option selected>Sedang</option><option>Sulit</option></select></div><div class="field"><label>Timer</label><select id="timerOn"><option value="0">Nonaktif</option><option value="1">20 detik/soal</option></select></div></div><p class="small">Bank soal contoh bertema hewan dan habitat. Guru dapat mengubah bank soal di kode HTML sesuai materi.</p><button class="primary" onclick="startQuiz()">Mulai Kuis 🚀</button></section><section id="play" class="panel hide"><span class="badge" id="ident"></span> <span class="badge" id="num"></span> <span class="timer" id="timer"></span><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="opts"></div><div id="feedback"></div><button id="next" class="green hide" onclick="nextQ()">Soal Berikutnya ➜</button></section><section id="result" class="panel hide"><h2>🎉 Kuis Selesai</h2><div class="score" id="score"></div><p id="stats" style="text-align:center"></p><p id="summary"></p><button class="primary" onclick="resetQuiz()">🔄 Ulangi</button></section><section id="picsetup" class="panel hide"><h2>🖼️ Tebak Gambar Hewan</h2><div class="grid"><div class="field"><label>Nama permainan</label><input id="gamename" value="Tebak Gambar Hewan"></div><div class="field"><label>Sekolah</label><input id="pschool"></div><div class="field"><label>Kelas</label><select id="pclass"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Mata pelajaran</label><input id="psubject" value="IPAS"></div><div class="field"><label>Tema</label><select><option>Hewan</option></select></div><div class="field"><label>Jumlah</label><select id="pcount"><option>5</option><option selected>8</option><option>10</option></select></div><div class="field"><label>Kesulitan</label><select id="pdiff"><option>Mudah</option><option selected>Sedang</option><option>Sulit</option></select></div></div><button class="pink" onclick="startPic()">Mulai 🐾</button></section><section id="picplay" class="panel hide"><span class="badge" id="pident"></span><span class="badge" id="pnum"></span><div class="progress"><div id="pbar"></div></div><div class="art" id="art"></div><h2>Hewan apakah ini?</h2><div class="hint" id="hint"></div><div class="options" id="poptions"></div><div id="pfeedback"></div><button id="pnext" class="green hide" onclick="nextPic()">Lanjut ➜</button></section><section id="picresult" class="panel hide"><h2>🏆 Hasil Tebak Gambar</h2><div class="score" id="pscore"></div><p id="pstats"></p><button class="pink" onclick="startPic()">Main Lagi</button></section></main><script>
const bank=[['Hewan yang bernapas menggunakan insang adalah?',['Kucing','Ikan','Ayam','Kupu-kupu'],1,'Ikan mengambil oksigen dari air melalui insang.'],['Tempat hidup alami hewan disebut…',['Habitat','Makanan','Cuaca','Benda'],0,'Habitat adalah tempat makhluk hidup tinggal.'],['Hewan pemakan tumbuhan adalah…',['Harimau','Elang','Kelinci','Buaya'],2,'Kelinci termasuk herbivora.'],['Hewan yang dapat terbang adalah…',['Gajah','Burung','Kambing','Ikan'],1,'Burung memiliki sayap.'],['Hewan yang hidup di dua alam disebut…',['Mamalia','Reptil','Amfibi','Serangga'],2,'Amfibi dapat hidup di air dan darat.'],['Hewan yang memiliki belalai adalah…',['Jerapah','Gajah','Zebra','Panda'],1,'Gajah menggunakan belalai untuk mengambil makanan.'],['Perubahan bentuk pada kupu-kupu disebut…',['Migrasi','Metamorfosis','Adaptasi','Hibernasi'],1,'Kupu-kupu mengalami metamorfosis sempurna.'],['Hewan yang aktif malam hari adalah…',['Ayam','Burung hantu','Sapi','Kupu-kupu'],1,'Burung hantu umumnya aktif pada malam hari.'],['Alat gerak ikan di air adalah…',['Sayap','Kaki','Sirip','Belalai'],2,'Sirip membantu ikan berenang.'],['Pemakan daging disebut…',['Herbivora','Karnivora','Omnivora','Produsen'],1,'Karnivora adalah pemakan daging.'],['Hewan yang menyamarkan diri melakukan…',['Kamuflase','Fotosintesis','Evaporasi','Rotasi'],0,'Kamuflase membantu bersembunyi.'],['Contoh omnivora adalah…',['Sapi','Harimau','Ayam','Kelinci'],2,'Ayam memakan biji dan hewan kecil.'],['Reptil bercangkang adalah…',['Kura-kura','Kuda','Kucing','Lumba-lumba'],0,'Cangkang melindungi kura-kura.'],['Hewan gurun adalah…',['Penguin','Unta','Katak','Ikan mas'],1,'Unta beradaptasi dengan lingkungan gurun.'],['Hewan yang menyusui anaknya adalah…',['Mamalia','Serangga','Ikan','Amfibi'],0,'Mamalia menyusui anaknya.']];
const svg=b=>`<svg viewBox="0 0 300 220">${b}</svg>`;const animals=[['Kucing',svg('<circle cx="150" cy="110" r="60" fill="#f6a64b"/><path d="M95 65 80 20 125 45M175 45 220 20 205 65" fill="#f6a64b" stroke="#d67b24" stroke-width="5"/><circle cx="128" cy="100" r="8"/><circle cx="172" cy="100" r="8"/><path d="M140 118h20l-10 12z" fill="#e85d73"/>'),'Peliharaan yang mengeong.'],['Gajah',svg('<ellipse cx="145" cy="130" rx="90" ry="65" fill="#9eafc0"/><circle cx="95" cy="90" r="48" fill="#aab8c8"/><circle cx="95" cy="90" r="38" fill="#e6a9b6"/><circle cx="180" cy="85" r="45" fill="#9cabbc"/><path d="M205 100q40 20 15 70q-15 20-30 0" fill="#9cabbc" stroke="#8294a8" stroke-width="7"/>'),'Besar, memiliki belalai panjang.'],['Kupu-kupu',svg('<ellipse cx="95" cy="95" rx="55" ry="65" fill="#ff80a8"/><ellipse cx="205" cy="95" rx="55" ry="65" fill="#8b7af0"/><ellipse cx="100" cy="155" rx="40" ry="35" fill="#ffc95c"/><ellipse cx="200" cy="155" rx="40" ry="35" fill="#63c9b3"/><rect x="142" y="65" width="16" height="110" rx="8" fill="#574c78"/>'),'Serangga bersayap indah.'],['Ikan',svg('<ellipse cx="140" cy="110" rx="90" ry="55" fill="#54b9e8"/><path d="M220 110 280 55 280 165z" fill="#328ac7"/><path d="M135 65 160 20 190 70M135 155 160 200 190 150" fill="#6dd1e8"/><circle cx="90" cy="95" r="10" fill="#24334a"/>'),'Bernapas dengan insang.'],['Burung',svg('<ellipse cx="145" cy="120" rx="70" ry="50" fill="#58c7a2"/><circle cx="205" cy="85" r="40" fill="#70d8b5"/><path d="M240 85 285 100 240 112" fill="#f4ad42"/><path d="M130 110Q90 45 55 100Q95 140 130 130" fill="#3cae8a"/>'),'Berbulu dan memiliki sayap.'],['Unta',svg('<ellipse cx="145" cy="130" rx="75" ry="42" fill="#c78b52"/><path d="M110 95Q100 35 140 40Q180 35 175 95" fill="#c78b52"/><path d="M180 100Q200 55 230 65L240 90 220 110" fill="#c78b52"/><circle cx="230" cy="78" r="6" fill="#24334a"/>'),'Memiliki punuk dan hidup di gurun.'],['Kura-kura',svg('<ellipse cx="145" cy="120" rx="80" ry="65" fill="#5d9d67"/><ellipse cx="145" cy="115" rx="65" ry="50" fill="#8b6d47"/><path d="M145 65v100M80 115h130M100 80l90 70M190 80l-90 70" stroke="#d4b27b" stroke-width="7"/><circle cx="235" cy="115" r="30" fill="#5d9d67"/>'),'Reptil dengan cangkang.'],['Katak',svg('<ellipse cx="150" cy="140" rx="75" ry="55" fill="#72c96e"/><circle cx="105" cy="85" r="35" fill="#72c96e"/><circle cx="195" cy="85" r="35" fill="#72c96e"/><circle cx="105" cy="80" r="15" fill="#fff"/><circle cx="195" cy="80" r="15" fill="#fff"/><circle cx="105" cy="80" r="7" fill="#24334a"/><circle cx="195" cy="80" r="7" fill="#24334a"/>'),'Amfibi, bersuara krok.'],['Panda',svg('<circle cx="150" cy="110" r="75" fill="#fff"/><circle cx="95" cy="55" r="30" fill="#24334a"/><circle cx="205" cy="55" r="30" fill="#24334a"/><ellipse cx="110" cy="105" rx="25" ry="32" fill="#24334a"/><ellipse cx="190" cy="105" rx="25" ry="32" fill="#24334a"/><circle cx="110" cy="105" r="8" fill="#fff"/><circle cx="190" cy="105" r="8" fill="#fff"/>'),'Beruang hitam-putih pemakan bambu.'],['Jerapah',svg('<ellipse cx="130" cy="150" rx="65" ry="45" fill="#f4b94e"/><rect x="160" y="65" width="30" height="100" rx="12" fill="#f4b94e"/><ellipse cx="190" cy="55" rx="45" ry="30" fill="#f4b94e"/><circle cx="210" cy="48" r="6" fill="#24334a"/>'),'Hewan tinggi dengan leher panjang.']];let qi=0,score=0,answered=false,ti=null,sec=20,qs=[],pi=0,ps=0,pa=false,pdata=[];
function mode(m){document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===(m==='quiz'?0:1)));['setup','play','result','picsetup','picplay','picresult'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(m==='quiz'?'setup':'picsetup').classList.remove('hide')}
function startQuiz(){qs=bank.slice(0,+count.value);qi=score=0;setup.classList.add('hide');play.classList.remove('hide');ident.textContent=(school.value||'Sekolah')+' • '+subject.value+' • Kelas '+kelas.value;renderQ()}
function renderQ(){answered=false;let q=qs[qi];num.textContent=`Soal ${qi+1}/${qs.length}`;bar.style.width=(100*(qi+1)/qs.length)+'%';question.textContent=q[0];feedback.innerHTML='';next.classList.add('hide');opts.innerHTML='';q[1].forEach((a,i)=>{let b=document.createElement('button');b.className='option';b.textContent='ABCD'[i]+'. '+a;b.onclick=()=>answer(i);opts.appendChild(b)});if(timerOn.value==='1'){sec=20;timer.textContent='⏱️ '+sec;clearInterval(ti);ti=setInterval(()=>{sec--;timer.textContent='⏱️ '+sec;if(sec<=0){clearInterval(ti);if(!answered)answer(-1)}},1000)}else timer.textContent=''}
function answer(i){if(answered)return;answered=true;clearInterval(ti);let q=qs[qi];document.querySelectorAll('#opts .option').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===i&&i!==q[2])b.classList.add('wrong')});if(i===q[2]){score++;feedback.innerHTML='<div class="feedback ok">✅ Benar! '+q[3]+'</div>'}else feedback.innerHTML='<div class="feedback no">❌ '+(i<0?'Waktu habis.':'Belum tepat.')+' Jawaban: '+q[1][q[2]]+'. '+q[3]+'</div>';next.classList.remove('hide')}
function nextQ(){qi++;if(qi===qs.length){play.classList.add('hide');result.classList.remove('hide');document.getElementById('score').textContent=Math.round(score/qs.length*100);stats.textContent=score+' benar • '+(qs.length-score)+' salah • '+qs.length+' soal';summary.textContent=(school.value||'Sekolah')+' | Guru: '+(teacher.value||'-')+' | '+subject.value+' | Kelas '+kelas.value+' | Materi: '+material.value}else renderQ()}
function resetQuiz(){result.classList.add('hide');setup.classList.remove('hide')}
function startPic(){pdata=animals.slice(0,+pcount.value);pi=ps=0;picsetup.classList.add('hide');picplay.classList.remove('hide');pident.textContent=gamename.value+' • Kelas '+pclass.value;renderPic()}
function renderPic(){pa=false;let a=pdata[pi];pnum.textContent=`${pi+1}/${pdata.length}`;pbar.style.width=(100*(pi+1)/pdata.length)+'%';art.innerHTML=a[1];hint.textContent='💡 Petunjuk: '+a[2];pfeedback.innerHTML='';pnext.classList.add('hide');poptions.innerHTML='';let choices=[a[0],...animals.filter(x=>x[0]!==a[0]).map(x=>x[0])].sort(()=>Math.random()-.5).slice(0,4);if(!choices.includes(a[0]))choices[0]=a[0];choices.sort(()=>Math.random()-.5).forEach(n=>{let b=document.createElement('button');b.className='option';b.textContent=n;b.onclick=()=>answerPic(n,b,a);poptions.appendChild(b)})}
function answerPic(n,b,a){if(pa)return;pa=true;if(n===a[0]){ps++;pfeedback.innerHTML='<div class="feedback ok">🎉 Benar! Hebat sekali!</div>'}else pfeedback.innerHTML=`<div class="feedback no">🙌 Belum tepat. Jawabannya ${a[0]}.</div>`;document.querySelectorAll('#poptions .option').forEach(x=>{x.disabled=true;if(x.textContent===a[0])x.classList.add('correct');if(x===b&&n!==a[0])x.classList.add('wrong')});pnext.classList.remove('hide')}
function nextPic(){pi++;if(pi>=pdata.length){picplay.classList.add('hide');picresult.classList.remove('hide');pscore.textContent=Math.round(ps/pdata.length*100);pstats.textContent=ps+' benar • '+(pdata.length-ps)+' salah • '+pdata.length+' gambar'}else renderPic()}
</script></html>
