<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Game Edukasi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 30px 15px;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; font-size: 26px; }
        p { margin-bottom: 30px; color: #d0e1fd; font-size: 14px; }
        .daftar-game {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        .tombol-game {
            display: block;
            background-color: #ffffff;
            color: #1e3c72;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .tombol-game:hover, .tombol-game:active {
            background-color: #ffca28;
            color: #000000;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h1>🎮 Portal Game Edukasi</h1>
    <p>Pilih game yang ingin dimainkan:</p>
    
    <div class="daftar-game">
        <a href="PAPIN - Petualangan Ular Tangga Pintar.html" class="tombol-game">🎲 PAPIN - Petualangan Ular Tangga Pintar</a>
        <a href="Roda Keberuntungan - Sistem Pencernaan Manusia.html" class="tombol-game">🧬 Roda Keberuntungan - Sistem Pencernaan Manusia</a>
        <a href="Roda Putar Rasio Satuan.html" class="tombol-game">🎡 Roda Putar Rasio Satuan</a>
        <a href="Super Mario Edukasi - Tujuan Pembelajaran Platformer.html" class="tombol-game">🍄 Super Mario Edukasi - Tujuan Pembelajaran Platformer</a>
    </div>

</body>
</html>
